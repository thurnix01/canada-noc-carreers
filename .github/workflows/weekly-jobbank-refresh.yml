# Refresh Job Bank posting counts weekly, then redeploy GitHub Pages.
# Counts are snapshots near each community hub — not live Canada-wide totals.
name: Weekly Job Bank refresh

on:
  schedule:
    # Mondays 14:00 UTC ≈ 07:00 America/Vancouver (PST) / 06:00 (PDT)
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: weekly-jobbank-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install web deps
        run: |
          if [ -f web/package-lock.json ]; then npm ci --prefix web; else npm install --prefix web; fi

      - name: Export listings (incl. Job Bank counts)
        run: npm run export:data

      - name: Commit refreshed listings.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/listings.json
          if git diff --staged --quiet; then
            echo "No listings.json changes"
          else
            git commit -m "chore: refresh Job Bank posting counts"
            git push
          fi

      - name: Build and deploy Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run deploy:pages
