# Refresh Job Bank posting counts weekly, then redeploy GitHub Pages.
# Counts are snapshots near each community hub — not live Canada-wide totals.
name: Weekly Job Bank refresh

on:
  schedule:
    # Mondays 14:00 UTC ≈ 07:00 America/Vancouver (PST) / 06:00 (PDT)
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Keep separate from Deploy Pages so a long/stuck scrape cannot block SEO deploys.
  group: weekly-jobbank-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install web deps
        run: |
          if [ -f web/package-lock.json ]; then npm ci --prefix web; else npm install --prefix web; fi

      - name: Export listings (incl. Job Bank counts)
        run: npm run export:data

      - name: Build site
        run: |
          VITE_BASE=/ npm run build --prefix web
          touch web/dist/.nojekyll
          rm -rf web/dist/fonts
          find web/dist -name '.DS_Store' -delete

      # Upload first so Pages can deploy even if the main-branch commit races.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

      - name: Commit refreshed listings.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/listings.json
          if git diff --staged --quiet; then
            echo "No listings.json changes"
            exit 0
          fi
          git commit -m "chore: refresh Job Bank posting counts"
          # Export takes minutes; main may have moved (e.g. workflow fixes).
          git pull --rebase origin main || {
            echo "Rebase conflict — keeping refreshed listings.json"
            git checkout --ours -- web/public/data/listings.json || true
            git add web/public/data/listings.json
            GIT_EDITOR=true git rebase --continue
          }
          git push origin HEAD:main

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
